name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution. "I dim my monitor every evening by hand" is more useful than "add a schedule".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Monitorer to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: input
    id: monitor
    attributes:
      label: Monitor model (if it matters)
